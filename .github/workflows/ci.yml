name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests evals migrations

      - name: Test
        run: pytest -q --cov --cov-report=term --cov-report=xml

      - name: Migrations match models
        env:
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: |
          alembic upgrade head
          alembic check

      - name: Agent eval (fallback mode, no API key)
        run: python -m evals.run_eval --mode fallback
